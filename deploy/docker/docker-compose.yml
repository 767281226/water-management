# 宏禹水利管理平台 —— Docker Compose 部署
# 使用 ./deploy.sh 管理（初始化、启动、备份、升级），配置见 .env（由 .env.example 生成）

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-water_management}
      POSTGRES_USER: ${DB_USER:-water}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    image: hongyu-water/backend:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-water_management}
      DB_USERNAME: ${DB_USER:-water}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-12h}
      DOC_STORAGE_DIR: /app/data/docs
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-500MB}
      NAS_TYPE: ${NAS_TYPE:-none}
      NAS_ROOT: /nas
      NAS_MAX_FILES: ${NAS_MAX_FILES:-20000}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
    volumes:
      - ${DATA_DIR:-./data}/docs:/app/data/docs
      # 网盘：先在宿主机挂载（NFS/CIFS），再把挂载点填到 NAS_HOST_DIR；只读挂入容器
      - ${NAS_HOST_DIR:-./data/nas-empty}:/nas:ro
    logging: *default-logging

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: hongyu-water/web:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    logging: *default-logging
