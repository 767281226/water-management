<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>宏禹水利管理软件 · 演示原型</title>
<style>
:root{
  --primary:#2a78d6; --primary-d:#1c5cab; --primary-l:#e8f1fc;
  --nav:#0f2a4a; --nav-2:#163a63; --nav-text:#b9c8db;
  --bg:#f3f5f8; --surface:#ffffff; --line:#e3e7ee; --line-2:#eef1f5;
  --text:#1b2430; --text-2:#5a6577; --text-3:#8a94a6;
  --good:#1a8f4d; --good-l:#e5f5ec; --warn:#b77400; --warn-l:#fdf3e1;
  --bad:#d64545; --bad-l:#fdecec; --grey-l:#f0f2f5;
  --radius:10px; --shadow:0 1px 2px rgba(16,30,54,.06),0 2px 8px rgba(16,30,54,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none;cursor:pointer}
.hidden{display:none!important}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- login ---------- */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(135deg,#0f2a4a 0%,#1c5cab 60%,#2a78d6 100%);position:relative;overflow:hidden}
.login:before,.login:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.05)}
.login:before{width:620px;height:620px;left:-200px;bottom:-280px}
.login:after{width:420px;height:420px;right:-120px;top:-160px}
.login-card{position:relative;z-index:1;width:100%;max-width:400px;background:#fff;border-radius:16px;padding:36px 32px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff}
.logo svg{width:24px;height:24px;fill:#fff;stroke:none}
.login-brand h1{font-size:20px}
.login-sub{color:var(--text-3);font-size:13px;margin-bottom:26px}
.demo-acc{margin-top:22px;border-top:1px dashed var(--line);padding-top:16px}
.demo-acc p{font-size:12px;color:var(--text-3);margin-bottom:10px}
.demo-acc .chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-acc button{border:1px solid var(--line);background:#f8fafc;border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer}
.demo-acc button:hover{border-color:var(--primary);background:var(--primary-l)}
.demo-acc b{display:block;font-size:13px}.demo-acc small{color:var(--text-3);font-size:12px}

/* ---------- layout ---------- */
.app{display:flex;min-height:100%}
.sidebar{width:220px;background:var(--nav);color:var(--nav-text);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;color:#fff;border-bottom:1px solid rgba(255,255,255,.06)}
.brand .logo{width:34px;height:34px;border-radius:8px}
.brand b{font-size:15px;display:block}.brand small{font-size:11px;color:var(--nav-text)}
#nav{flex:1;overflow:auto;padding:10px 10px 20px}
.nav-group{font-size:12px;color:#7189a8;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--nav-text);margin-bottom:2px}
.nav-item:hover{background:var(--nav-2);color:#fff}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .badge{margin-left:auto}
.main-wrap{flex:1;margin-left:220px;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:20}
.topbar h2{font-size:16px;font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.role-switch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.role-switch select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff;font-size:12px}
.icon-btn{border:none;background:none;cursor:pointer;width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);position:relative}
.icon-btn:hover{background:var(--grey-l)}
.icon-btn .dot{position:absolute;top:4px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.user-chip{display:flex;align-items:center;gap:8px;cursor:pointer}
.user-chip .nm{line-height:1.2}.user-chip small{display:block;color:var(--text-3);font-size:11px}
main{padding:20px;max-width:1280px;width:100%}
.menu-btn{display:none}
.tabbar{display:none}

/* ---------- common ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h3{font-size:18px}
.page-head p{color:var(--text-3);font-size:13px;margin-top:4px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.card-title h4{font-size:15px}
.card-title small{color:var(--text-3);font-weight:normal}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.danger{color:var(--bad);border-color:#f2c4c4}.btn.danger:hover{background:var(--bad-l)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.link{border:none;background:none;color:var(--primary);padding:0 6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;background:var(--grey-l);color:var(--text-2);white-space:nowrap}
.tag.blue{background:var(--primary-l);color:var(--primary-d)}
.tag.good{background:var(--good-l);color:var(--good)}
.tag.warn{background:var(--warn-l);color:var(--warn)}
.tag.bad{background:var(--bad-l);color:var(--bad)}
.tag.dark{background:#e8eaf3;color:#3d4a7a}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px}
.muted{color:var(--text-3)}.small{font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 14px;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--primary);border-color:var(--primary);font-weight:600}
.seg{display:inline-flex;background:var(--grey-l);border-radius:8px;padding:3px}
.seg a{padding:6px 14px;border-radius:6px;color:var(--text-2);font-size:13px}
.seg a.active{background:#fff;color:var(--primary);box-shadow:var(--shadow);font-weight:600}
.empty{text-align:center;color:var(--text-3);padding:40px 10px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--primary-l);color:var(--primary-d);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.notice.warn{background:var(--warn-l);color:var(--warn)}
.notice.good{background:var(--good-l);color:var(--good)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;color:var(--text-2)}
.field>span i{color:var(--bad);font-style:normal}
.input,.field input,.field select,.field textarea{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;outline:none}
.field textarea{height:auto;min-height:60px;padding:8px 10px;resize:vertical}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(42,120,214,.12)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.span2{grid-column:span 2}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .input{width:auto;min-width:200px}
.page-head .input{width:auto}
.search{position:relative;flex:1;min-width:200px;max-width:420px}
.search .ic{position:absolute;left:10px;top:9px;color:var(--text-3)}
.search input{padding-left:34px;width:100%}
input[type=range]{accent-color:var(--primary)}

/* stat tiles */
.stat{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.stat .lb{color:var(--text-2);font-size:13px}
.stat .v{font-size:26px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--text-3);font-weight:normal;margin-left:2px}
.stat .sub{font-size:12px;color:var(--text-3);margin-top:4px}

/* todo */
.todo{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.todo:last-child{border-bottom:none}
.todo .ti{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.todo .tx{flex:1;min-width:0}.todo .tx b{display:block;font-weight:600}.todo .tx small{color:var(--text-3)}
.ti.blue{background:var(--primary-l);color:var(--primary)}.ti.warn{background:var(--warn-l);color:var(--warn)}
.ti.good{background:var(--good-l);color:var(--good)}.ti.bad{background:var(--bad-l);color:var(--bad)}

/* table */
.table-wrap{overflow-x:auto}
table.rt{width:100%;border-collapse:collapse}
.rt th{text-align:left;font-weight:600;color:var(--text-2);font-size:12px;background:#f7f9fb;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.rt td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.rt tr:hover td{background:#fafbfd}
.rt .num{text-align:right;font-variant-numeric:tabular-nums}
.pname{font-weight:600;color:var(--text)}
.pname:hover{color:var(--primary)}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.lrow:last-child{border-bottom:none}
.lrow .main{flex:1;min-width:0}
.lrow .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .m{font-size:12px;color:var(--text-3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ftype{width:38px;height:44px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;font-size:10px;font-weight:700;color:#fff;padding-bottom:6px;flex:none;position:relative}
.ftype:before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent #fff transparent transparent;opacity:.6}
.ft-pdf{background:#d64545}.ft-docx{background:#2a78d6}.ft-dwg{background:#1a8f4d}.ft-xlsx{background:#127a4a}.ft-zip{background:#7a6a3a}

/* plan item cards */
.item-card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}
.item-card .ih{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.item-no{font-weight:600;color:var(--primary)}
.plan-grid{display:grid;grid-template-columns:2fr 3fr 2fr 110px;gap:12px}
.plan-grid .full{grid-column:1/-1}
.plan-ro{background:#f7f9fb;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.plan-ro dt{color:var(--text-3)}
.pct-row{display:flex;align-items:center;gap:12px}
.pct-row input[type=range]{flex:1}
.pct-val{width:52px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;min-width:60px}
.progress i{display:block;height:100%;background:var(--primary);border-radius:3px}
.sticky-foot{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);margin:0 -18px -18px;padding:12px 18px;border-radius:0 0 var(--radius) var(--radius);display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}

/* steps */
.steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.step{display:inline-flex;align-items:center;gap:4px;color:var(--text-3)}
.step .sd{width:8px;height:8px;border-radius:50%;background:#c8ced8}
.step.done{color:var(--good)}.step.done .sd{background:var(--good)}
.step.cur{color:var(--warn)}.step.cur .sd{background:var(--warn)}
.step.rej{color:var(--bad)}.step.rej .sd{background:var(--bad)}
.step-sep{width:16px;height:1px;background:#c8ced8}

/* docs */
.docs-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.cat-tree .ct{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;color:var(--text-2)}
.cat-tree .ct:hover{background:var(--grey-l)}
.cat-tree .ct.active{background:var(--primary-l);color:var(--primary-d);font-weight:600}
.cat-tree .ct.sub{padding-left:24px;font-size:13px}
.cat-chips{display:none;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{padding:6px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);white-space:nowrap;cursor:pointer;font-size:13px}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.doc-paper{background:#fff;border:1px solid var(--line);border-radius:4px;padding:40px 48px;min-height:480px;position:relative;overflow:hidden;line-height:1.9;font-family:"SimSun","Songti SC",serif}
.doc-paper h2{text-align:center;font-size:20px;margin-bottom:6px}
.doc-paper .code{text-align:center;color:var(--text-2);margin-bottom:24px}
.doc-paper h5{font-size:15px;margin:16px 0 6px}
.doc-paper p{text-indent:2em;color:#333}
.wm{position:absolute;inset:0;pointer-events:none;opacity:.12}
.preview-bg{background:#e9ecf1;padding:18px;border-radius:8px;max-height:62vh;overflow:auto}

/* modal */
.mask{position:fixed;inset:0;background:rgba(15,30,50,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h4{font-size:16px}
.modal-b{padding:20px;overflow:auto}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toast-root{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1b2430;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:fade .2s;max-width:90vw}
.toast.good{background:var(--good)}.toast.bad{background:var(--bad)}

/* chart */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid-l{stroke:#e8ebf0;stroke-width:1}
.chart .axis-t{fill:#8a94a6;font-size:11px}
.chart .val-t{fill:#1b2430;font-size:11px;font-weight:600}
.chart .bar{fill:#2a78d6}
.chart .bar.me{fill:#1c5cab}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.bar,.chart g:hover .bar{fill:#1c5cab}
.tip{position:fixed;z-index:300;background:#1b2430;color:#fff;font-size:12px;padding:6px 10px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.legend-note{font-size:12px;color:var(--text-3);margin-top:8px}

.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px}
.kv div span{display:block;font-size:12px;color:var(--text-3);margin-bottom:2px}
.kv div b{font-weight:500}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl{position:relative;padding-bottom:14px}
.tl:before{content:"";position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
.tl .tlh{font-size:12px;color:var(--text-3)}
.score-big{font-size:28px;font-weight:700;color:var(--primary-d);font-variant-numeric:tabular-nums}
.rule-row{display:grid;grid-template-columns:1fr 160px 60px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.rule-row:last-child{border-bottom:none}
.rule-row .rn b{display:block}.rule-row .rn small{color:var(--text-3)}
.more-list .nav-item{color:var(--text);padding:14px 12px;border-bottom:1px solid var(--line-2);border-radius:0;margin:0}
.more-list .nav-item:hover{background:var(--grey-l);color:var(--text)}
.demo-ribbon{position:fixed;right:-34px;bottom:22px;transform:rotate(-45deg);background:#eda100;color:#fff;font-size:11px;padding:3px 40px;z-index:25;pointer-events:none;letter-spacing:1px}

/* ---------- mobile ---------- */
@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .docs-layout{grid-template-columns:minmax(0,1fr)}
  .cat-tree{display:none}
  .cat-chips{display:flex}
}
@media (max-width:768px){
  body{font-size:15px}
  .sidebar{display:none}
  .main-wrap{margin-left:0}
  .topbar{height:50px;padding:0 14px}
  .topbar h2{font-size:16px}
  .role-switch,.user-chip .nm{display:none}
  main{padding:12px 12px calc(76px + env(safe-area-inset-bottom))}
  .g2{grid-template-columns:1fr}
  .card{padding:14px;margin-bottom:12px}
  .grid{gap:12px}
  .stat{padding:12px 14px}.stat .v{font-size:22px}
  .form-grid{grid-template-columns:1fr}.span2{grid-column:auto}
  .plan-grid{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr 1fr}
  .page-head h3{font-size:17px}
  .toolbar .input,.search{min-width:0;max-width:none;width:100%;flex:1 1 100%}
  .sticky-foot{margin:0 -14px -14px;padding:10px 14px;bottom:calc(60px + env(safe-area-inset-bottom))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);z-index:40}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--text-3);position:relative}
  .tabbar a.active{color:var(--primary)}
  .tabbar svg.ic{width:22px;height:22px}
  .tabbar .badge{position:absolute;top:5px;left:calc(50% + 6px)}
  /* responsive table -> cards */
  table.rt.cards thead{display:none}
  table.rt.cards,table.rt.cards tbody,table.rt.cards tr,table.rt.cards td{display:block;width:100%}
  table.rt.cards tr{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  table.rt.cards td{border:none;padding:4px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.rt.cards td:before{content:attr(data-l);color:var(--text-3);font-size:13px;text-align:left;flex:none}
  table.rt.cards td.first{display:block;text-align:left;font-size:15px;padding-bottom:6px;border-bottom:1px dashed var(--line);margin-bottom:4px}
  table.rt.cards td.first:before{display:none}
  table.rt.cards td.num{text-align:right}
  table.rt.cards tr:hover td{background:none}

function router(){
  if (!me()){ showLogin(); return; }

    <label class="field span2"><span>项目名称 <i>*</i></span><input id="ep-name" value="${esc(p.name)}" placeholder="如：XX县XX河道治理工程初步设计"></label>
    <label class="field"><span>委托单位</span><input id="ep-client" value="${esc(p.client)}"></label>

    <div class="field span2"><span>参与人员</span><div class="btns">${staff.map(u => `<label class="tag" style="cursor:pointer"><input type="checkbox" class="ep-m" value="${u.id}" ${p.members.includes(u.id) ? 'checked' : ''}> ${u.name}</label>`).join('')}</div></div>
  </div>`, `<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveProject('${id || ''}')">保存</button>`);

function saveProject(id){
  const v = k => $('#ep-' + k).value.trim();
  if (!v('code') || !v('name') || !v('end')) return toast('请填写必填项', 'bad');
  const data = { code:v('code'), name:v('name'), type:v('type'), client:v('client'), amount:v('amount'), leader:v('leader'), dept:v('dept'), start:v('start'), planEnd:v('end'),
    members:[...document.querySelectorAll('.ep-m:checked')].map(i => i.value).filter(m => m !== v('leader')) };
  if (id) Object.assign(P(id), data); else db.projects.unshift({ id:uid('p'), status:'未开始', ...data });
  log(id ? '编辑项目' : '新建项目', data.name); save(); closeModal(); toast('项目已保存', 'good'); router();
}

/* ---------- 项目详情 ---------- */
PAGES.project = () => {
  const p = P(param); if (!p) return '<div class="empty">项目不存在</div>';
  const entries = [];
  Object.values(db.plans).forEach(pl => pl.items.forEach(it => { if (it.pid === p.id) entries.push({ ...it, uid:pl.uid, wk:pl.wk, mon:pl.mon }); }));
  entries.sort((a, b) => b.mon.localeCompare(a.mon));
  const hours = entries.reduce((a, b) => a + (+(b.actualDays != null ? b.actualDays : b.days) || 0), 0);
  const isLeader = p.leader === ME, canConfirm = (has('manager') && me().dept === p.dept) || has('leader') || has('admin');
  const sc = db.scores.find(s => s.pid === p.id);
  return `
  <div class="page-head"><div><a class="small" onclick="go('projects')">‹ 返回项目台账</a><h3 style="margin-top:6px">${esc(p.name)}</h3><p>${p.code} · ${statusTag(p.status)}</p></div>
    <div class="btns">
      ${(isLeader || isMgr()) && p.status !== '已存档' ? `<button class="btn" onclick="editProject('${p.id}')">编辑</button>` : ''}
      ${p.status === '进行中' && (isLeader || canConfirm) ? `<button class="btn" onclick="setPStatus('${p.id}','已完成')">标记完成</button>` : ''}
      ${p.status === '已完成' && isLeader && !p.archiveApply ? `<button class="btn primary" onclick="applyArchive('${p.id}')">申请存档</button>` : ''}
      ${p.status === '已完成' && p.archiveApply ? (canConfirm ? `<button class="btn primary" onclick="confirmArchive('${p.id}')">确认存档</button>` : `<span class="tag warn">存档申请审核中</span>`) : ''}
    </div></div>
  ${p.status === '已完成' && !p.archiveApply ? `<div class="notice">${ic('info')}<div>项目已完成，成果提交后请由项目负责人<b>申请存档</b>；部门负责人确认后变为"已存档"，进入当月考评。</div></div>` : ''}
  <div class="card"><div class="card-title"><h4>基本信息</h4></div>
    <div class="kv">
      <div><span>项目类型</span><b>${p.type}</b></div><div><span>委托单位</span><b>${esc(p.client)}</b></div><div><span>合同金额</span><b>${p.amount ? p.amount + ' 万元' : '—'}</b></div>
      <div><span>项目负责人</span><b>${U(p.leader).name}</b></div><div><span>所属部门</span><b>${deptName(p.dept)}</b></div><div><span>参与人员</span><b>${p.members.map(m => U(m).name).join('、') || '—'}</b></div>
      <div><span>开始日期</span><b>${p.start}</b></div><div><span>计划完成</span><b>${p.planEnd}</b></div><div><span>实际完成 / 存档</span><b>${p.actualEnd || '—'} / ${p.archive || '—'}</b></div>
    </div></div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="stat"><div class="lb">周报记录</div><div class="v">${entries.length}<small>条</small></div></div>
    <div class="stat"><div class="lb">累计工时</div><div class="v">${hours}<small>人·天</small></div></div>
    <div class="stat"><div class="lb">参与人数</div><div class="v">${p.members.length + 1}<small>人</small></div></div>
    <div class="stat"><div class="lb">考评得分</div><div class="v">${sc && sc.status === '已发布' ? scoreTotal(sc).toFixed(1) : '—'}<small>${sc ? sc.status : '未考评'}</small></div></div>
  </div>
  <div class="card"><div class="card-title"><h4>项目周报动态</h4><small>来自成员每周的计划和完成情况</small></div>
    ${entries.length ? `<div class="timeline">${entries.slice(0, 12).map(e => `<div class="tl"><div class="tlh">${weekLabel(new Date(e.mon), true)} · ${U(e.uid).name}</div>
      <div>${esc(e.content)} <span class="muted">— ${esc(e.target)}</span></div>
      <div class="small muted">计划 ${e.days} 天${e.pct != null ? ` · 完成 <b style="color:${e.pct < 100 ? 'var(--warn)' : 'var(--good)'}">${e.pct}%</b>${e.reason ? ' · 原因：' + esc(e.reason) : ''}` : ' · 本周进行中'}</div></div>`).join('')}</div>` : '<div class="empty">暂无周报记录</div>'}
  </div>`;
};
function setPStatus(id, s){ const p = P(id); p.status = s; if (s === '已完成') p.actualEnd = fmtD(TODAY); log('项目状态变更', p.name + ' → ' + s); save(); toast('项目状态已更新为：' + s, 'good'); router(); }
function applyArchive(id){ P(id).archiveApply = true; save(); toast('存档申请已提交，等待部门负责人确认', 'good'); router(); }
function confirmArchive(id){
  const p = P(id); p.status = '已存档'; p.archive = fmtD(TODAY); p.archiveApply = false;
  if (!db.scores.find(s => s.pid === id)) db.scores.push({ id:uid('s'), pid:id, month:ym(TODAY), items:null, comment:'', status:'待打分' });
  log('确认存档', p.name); save(); toast(`已存档，已进入 ${ym(TODAY)} 月度考评清单`, 'good'); router();
}

/* ---------- 周计划填报 ---------- */
let planDraft = null;
const blankItem = () => ({ pid:'', content:'', target:'', days:1, note:'', pct:null, actual:'', actualDays:null, reason:'' });
const fillSeg = k => `<div class="seg"><a class="${k === 'plan' ? 'active' : ''}" onclick="go('plan')">周一 · 本周计划</a><a class="${k === 'report' ? 'active' : ''}" onclick="go('report')">周五 · 完成情况</a></div>`;
PAGES.plan = () => {
  const u = me(), p = getPlan(u.id, CUR_WK);
  const locked = p && p.reportStatus === '已提交';
  if (!planDraft) planDraft = p ? clone(p.items) : [blankItem()];
  const projs = myProjects(u.id).filter(x => ['进行中','已完成','未开始'].includes(x.status));
  const opts = sel => `<option value="">请选择项目</option>${projs.map(x => `<option value="${x.id}" ${sel === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}<option value="other" ${sel === 'other' ? 'selected' : ''}>其他工作（会议/投标/培训等）</option>`;
  const total = planDraft.reduce((a, b) => a + (+b.days || 0), 0);
  return `
  <div class="page-head"><div><h3>周计划填报</h3><p>${weekLabel(weekMon(0))} · 截止时间 ${db.fillRules.planDeadline}</p></div>${fillSeg('plan')}</div>
  ${p ? `<div class="notice ${p.overdue ? 'warn' : 'good'}">${ic(p.overdue ? 'clock' : 'check')}<div>本周计划已于 <b>${fmtDT(p.submittedAt)}</b> 提交${p.overdue ? '（逾期提交，将计入考评）' : ''}。${locked ? '完成情况已提交，计划已锁定。' : '填报周五完成情况前还可以修改。'}${p.comment ? `<br>负责人点评：${esc(p.comment)}` : ''}</div></div>`
       : `<div class="notice">${ic('info')}<div>请在每周一填写本周的工作计划，一个项目一行。系统会在 ${db.fillRules.planRemind} 自动提醒。<span class="muted">（演示环境不限制填报时间）</span></div></div>`}
  <div class="card">
    <div class="card-title"><h4>本周工作计划 <small>共 ${planDraft.length} 项 · 计划工时 <b id="plan-total">${total}</b> 天</small></h4>
      ${locked ? '' : `<div class="btns"><button class="btn sm" onclick="planCarry()">${ic('refresh', 14)}带入上周未完成</button></div>`}</div>
    ${planDraft.map((it, i) => `
      <div class="item-card">
        <div class="ih"><span class="item-no">事项 ${i + 1}</span>${locked || planDraft.length === 1 ? '' : `<button class="icon-btn" title="删除" onclick="planDel(${i})">${ic('trash', 16)}</button>`}</div>
        <div class="plan-grid">
          <label class="field"><span>关联项目 <i>*</i></span><select ${locked ? 'disabled' : ''} onchange="planDraft[${i}].pid=this.value">${opts(it.pid)}</select></label>
          <label class="field"><span>工作内容 <i>*</i></span><input ${locked ? 'disabled' : ''} value="${esc(it.content)}" placeholder="如：水文分析计算" oninput="planDraft[${i}].content=this.value"></label>
          <label class="field"><span>计划目标 / 成果</span><input ${locked ? 'disabled' : ''} value="${esc(it.target)}" placeholder="如：完成计算书" oninput="planDraft[${i}].target=this.value"></label>
          <label class="field"><span>计划工时（天）<i>*</i></span><input ${locked ? 'disabled' : ''} type="number" min="0" max="7" step="0.5" value="${it.days}" oninput="planDraft[${i}].days=this.value;planSum()"></label>
          <label class="field full"><span>备注</span><input ${locked ? 'disabled' : ''} value="${esc(it.note)}" placeholder="选填" oninput="planDraft[${i}].note=this.value"></label>
        </div>
      </div>`).join('')}
    ${locked ? '' : `<button class="btn" style="width:100%;border-style:dashed" onclick="planAdd()">${ic('plus')}添加一项</button>
    <div class="sticky-foot" style="margin-top:16px"><span class="muted small">提交后部门负责人可以看到</span><div class="btns"><button class="btn primary" onclick="planSubmit()">${p ? '保存修改' : '提交本周计划'}</button></div></div>`}
  </div>`;
};
function planSum(){ const el = $('#plan-total'); if (el) el.textContent = planDraft.reduce((a, b) => a + (+b.days || 0), 0); }
function planAdd(){ planDraft.push(blankItem()); router(); }
function planDel(i){ planDraft.splice(i, 1); router(); }
function planCarry(){
  const last = getPlan(ME, weekKey(weekMon(-1)));
  const todo = last ? last.items.filter(i => i.pct != null && i.pct < 100) : [];
  if (!todo.length) return toast('上周没有未完成的事项');
  planDraft = planDraft.filter(i => i.pid || i.content).concat(todo.map(i => ({ ...blankItem(), pid:i.pid, content:i.content + '（续）', target:i.target, days:i.days })));
  toast(`已带入 ${todo.length} 项上周未完成的事项`, 'good'); router();
}
function planSubmit(){
  for (const [i, it] of planDraft.entries()){
    if (!it.pid) return toast(`事项 ${i + 1}：请选择关联项目`, 'bad');
    if (!it.content.trim()) return toast(`事项 ${i + 1}：请填写工作内容`, 'bad');
    if (!(+it.days > 0)) return toast(`事项 ${i + 1}：计划工时必须大于 0`, 'bad');
  }
  const k = ME + '|' + CUR_WK, old = db.plans[k];
  db.plans[k] = { uid:ME, wk:CUR_WK, mon:fmtD(weekMon(0)), status:'已提交', submittedAt: old ? old.submittedAt : Date.now(), overdue: old ? old.overdue : TODAY.getDay() !== 1,
    items:clone(planDraft), extra: old ? old.extra : [], reportStatus:'未填', reportAt:null, comment: old ? old.comment : '' };
  log('提交周计划', CUR_WK); save(); planDraft = null;
  toast(old ? '计划已更新' : '本周计划提交成功', 'good'); router();
}

/* ---------- 周完成情况 ---------- */
let reportDraft = null;
PAGES.report = () => {
  const u = me(), p = getPlan(u.id, CUR_WK);
  const head = `<div class="page-head"><div><h3>周完成情况填报</h3><p>${weekLabel(weekMon(0))} · 截止时间 ${db.fillRules.reportDeadline}</p></div>${fillSeg('report')}</div>`;
  if (!p) return head + `<div class="card empty">${ic('edit', 36)}<p style="margin:12px 0">本周还没有提交计划，完成情况需要对照计划填写</p><button class="btn primary" onclick="go('plan')">先去填写本周计划</button></div>`;
  const done = p.reportStatus === '已提交';
  if (!reportDraft) reportDraft = { items: clone(p.items).map(i => ({ ...i, pct: i.pct == null ? 100 : i.pct, actualDays: i.actualDays == null ? i.days : i.actualDays })), extra: clone(p.extra || []) };
  const projs = myProjects(u.id);
  return head + `
  ${done ? `<div class="notice good">${ic('check')}<div>完成情况已于 <b>${fmtDT(p.reportAt)}</b> 提交，本周计划完成率 <b>${planRate(p)}%</b>。</div></div>`
         : `<div class="notice">${ic('info')}<div>系统已自动带出本周计划，请逐条填写完成比例；完成比例低于 100% 时需要填写原因。<span class="muted">（演示环境不限制填报时间）</span></div></div>`}
  <div class="card">
    <div class="card-title"><h4>计划事项完成情况</h4><div>本周完成率 <span class="score-big" id="rate-sum" style="font-size:22px">${Math.round(avg(reportDraft.items.map(i => +i.pct)))}%</span></div></div>
    ${reportDraft.items.map((it, i) => `
      <div class="item-card">
        <div class="ih"><span class="item-no">事项 ${i + 1}</span><span class="tag">${esc(pname(it.pid))}</span></div>
        <dl class="plan-ro"><dt>计划内容</dt><dd>${esc(it.content)}</dd><dt>计划目标</dt><dd>${esc(it.target) || '—'}</dd><dt>计划工时</dt><dd>${it.days} 天</dd></dl>
        <div class="plan-grid">
          <div class="field" style="grid-column:span 2"><span>完成比例 <i>*</i></span><div class="pct-row"><input type="range" min="0" max="100" step="10" value="${it.pct}" ${done ? 'disabled' : ''} oninput="repPct(${i},this.value)"><span class="pct-val" id="pv-${i}">${it.pct}%</span></div></div>
          <label class="field"><span>实际工时（天）</span><input type="number" step="0.5" min="0" value="${it.actualDays}" ${done ? 'disabled' : ''} oninput="reportDraft.items[${i}].actualDays=this.value"></label>
          <div></div>
          <label class="field" style="grid-column:span 2"><span>实际完成内容</span><input value="${esc(it.actual)}" placeholder="如：已完成计算书初稿" ${done ? 'disabled' : ''} oninput="reportDraft.items[${i}].actual=this.value"></label>
          <label class="field" style="grid-column:span 2" id="rs-${i}"><span>未完成原因 ${it.pct < 100 ? '<i>*</i>' : ''}</span><input value="${esc(it.reason)}" placeholder="完成比例低于 100% 时必填" ${done ? 'disabled' : ''} oninput="reportDraft.items[${i}].reason=this.value"></label>
        </div>
      </div>`).join('')}
  </div>
  <div class="card">
    <div class="card-title"><h4>计划外工作 <small>本周临时增加的工作</small></h4>${done ? '' : `<button class="btn sm" onclick="reportDraft.extra.push({pid:'other',content:'',actualDays:0.5});router()">${ic('plus', 14)}添加</button>`}</div>
    ${reportDraft.extra.length ? reportDraft.extra.map((e, i) => `<div class="item-card"><div class="plan-grid">
      <label class="field"><span>关联项目</span><select ${done ? 'disabled' : ''} onchange="reportDraft.extra[${i}].pid=this.value">${projs.map(x => `<option value="${x.id}" ${e.pid === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}<option value="other" ${e.pid === 'other' ? 'selected' : ''}>其他工作</option></select></label>
      <label class="field"><span>工作内容</span><input ${done ? 'disabled' : ''} value="${esc(e.content)}" placeholder="如：配合投标技术标编写" oninput="reportDraft.extra[${i}].content=this.value"></label>
      <label class="field"><span>工时（天）</span><input ${done ? 'disabled' : ''} type="number" step="0.5" value="${e.actualDays}" oninput="reportDraft.extra[${i}].actualDays=this.value"></label>
      <div class="field"><span>&nbsp;</span>${done ? '' : `<button class="btn danger" onclick="reportDraft.extra.splice(${i},1);router()">删除</button>`}</div></div></div>`).join('') : '<div class="muted small">无计划外工作</div>'}
    ${done ? '' : `<div class="sticky-foot" style="margin-top:16px"><span class="muted small">附件（成果截图）：<a onclick="toast('演示：选择文件上传')">+ 上传附件</a></span><button class="btn primary" onclick="reportSubmit()">提交本周完成情况</button></div>`}
  </div>`;
};
function repPct(i, v){
  reportDraft.items[i].pct = +v; $('#pv-' + i).textContent = v + '%';
  $('#rs-' + i).querySelector('span').innerHTML = '未完成原因 ' + (+v < 100 ? '<i>*</i>' : '');
  $('#rate-sum').textContent = Math.round(avg(reportDraft.items.map(x => +x.pct))) + '%';
}
function reportSubmit(){
  for (const [i, it] of reportDraft.items.entries()) if (it.pct < 100 && !String(it.reason).trim()) return toast(`事项 ${i + 1}：完成比例低于 100%，请填写未完成原因`, 'bad');
  const p = getPlan(ME, CUR_WK);
  p.items = clone(reportDraft.items); p.extra = clone(reportDraft.extra).filter(e => e.content); p.reportStatus = '已提交'; p.reportAt = Date.now();
  log('提交周完成情况', CUR_WK); save(); reportDraft = null;
  toast(`提交成功，本周完成率 ${planRate(p)}%`, 'good'); router();
}

/* ---------- 周报查询统计 ---------- */

function barV(data, unit){
  const W = 640, H = 220, pl = 32, pb = 26, pt = 18, max = Math.max(...data.map(d => d.value)) || 1;
  const step = Math.ceil(max / 4), top = step * 4, bw = Math.min(36, (W - pl) / data.length * 0.55), gap = (W - pl) / data.length;
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for (let i = 0; i <= 4; i++){ const v = step * i; s += `<line class="grid-l" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-t" x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; }
  data.forEach((d, i) => {
    const cx = pl + gap * i + gap / 2, x = cx - bw / 2, yy = y(d.value), h = H - pb - yy, r = Math.min(4, h);
    s += `<g data-tip="${d.label}：<b>${d.value}</b> ${unit}"><rect class="hit" x="${pl + gap * i}" y="${pt}" width="${gap}" height="${H - pt - pb}"/>`;
    if (h > 0) s += `<path class="bar" d="M${x},${H - pb} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${H - pb} Z"/>`;
    s += `<text class="axis-t" x="${cx}" y="${H - 8}" text-anchor="middle">${d.label}</text></g>`;
  });
  return s + '</svg>';
}
function barH(rows, unit, meId){
  const W = 640, rh = 30, pl = 60, pr = 46, H = rows.length * rh + 6, min = 0, max = 100;
  const x = v => pl + (W - pl - pr) * (v - min) / (max - min);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  rows.forEach((r, i) => {
    const yy = i * rh + 6, bh = 16, xe = x(r.value), isMe = r.id === meId;
    s += `<g data-tip="${r.label}：<b>${r.value}</b> ${unit}（第 ${i + 1} 名）"><rect class="hit" x="0" y="${yy - 4}" width="${W}" height="${rh}"/>
      <text class="axis-t" x="${pl - 8}" y="${yy + 12}" text-anchor="end" style="${isMe ? 'fill:#1b2430;font-weight:700' : ''}">${r.label}</text>
      <path class="bar ${isMe ? 'me' : ''}" d="M${pl},${yy} H${xe - 4} Q${xe},${yy} ${xe},${yy + 4} V${yy + bh - 4} Q${xe},${yy + bh} ${xe - 4},${yy + bh} H${pl} Z"/>
      <text class="val-t" x="${xe + 6}" y="${yy + 12}">${r.value}</text></g>`;
  });
  return s + `</svg>`;
}

    <label class="field"><span>编号 / 标准号</span><input id="up-c" value="${esc(d.code)}" placeholder="如 SL 252-2017"></label>
    <label class="field"><span>年份</span><input id="up-y" type="number" value="${d.year}"></label>
    <label class="field"><span>一级分类</span><select id="up-cat">${['相关规范','公司成果','行业资料'].map(c => `<option ${d.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
    <label class="field"><span>二级分类</span><input id="up-sub" value="${esc(d.sub)}" placeholder="如 水利行业标准"></label>
    <label class="field span2"><span>密级</span><select id="up-l">${['公开','内部','涉密'].map(c => `<option ${d.level === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
    <div class="notice span2" style="margin:0">${ic('info')}<div>公开 / 内部资料：部门负责人审批；涉密资料：部门负责人 + 公司领导两级审批。</div></div></div>`,
    `<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveDoc('${id || ''}')">保存</button>`);
}
function saveDoc(id){
  const n = $('#up-n').value.trim(); if (!n) return toast('请填写资料名称', 'bad');
  const f = $('#up-f'); if (!id && f && !f.files.length && !confirm('演示环境：未选择文件，是否以模拟文件继续？')) return;
  const data = { name:n, code:$('#up-c').value || '—', year:+$('#up-y').value, cat:$('#up-cat').value, sub:$('#up-sub').value || '其他', level:$('#up-l').value };
  if (id) Object.assign(DOC(id), data);
  else { const ext = f && f.files[0] ? (f.files[0].name.split('.').pop() || 'pdf').toLowerCase() : 'pdf';
    db.docs.unshift({ id:uid('doc'), ...data, ftype:['pdf','docx','dwg','xlsx'].includes(ext) ? ext : 'pdf', size:f && f.files[0] ? (f.files[0].size / 1048576).toFixed(1) + ' MB' : '1.0 MB', views:0, downloads:0, status:'上架', uploadAt:fmtD(TODAY), uploader:ME, isNew:true }); log('上传资料', n); }
  save(); closeModal(); toast('资料已保存', 'good'); router();
}
function syncNAS(){
  const b = $('#sync-btn'); b.disabled = true; b.innerHTML = '正在扫描 \\\\NAS01\\资料库 …';
  setTimeout(() => {
    const add = [
      { name:'水利水电工程施工组织设计规范', code:'SL 303-2017', cat:'相关规范', sub:'水利行业标准', year:2017, level:'公开', ftype:'pdf', size:'4.1 MB' },
      { name:'翠屏水库扩建工程竣工验收资料', code:'HY-2024-007', cat:'公司成果', sub:'设计报告', year:2024, level:'内部', ftype:'zip', size:'210 MB' }
    ].filter(a => !db.docs.find(d => d.code === a.code && d.name === a.name));
    add.forEach(a => db.docs.unshift({ id:uid('doc'), ...a, views:0, downloads:0, status:'上架', uploadAt:fmtD(TODAY), uploader:ME, isNew:true }));
    db.lastSync = Date.now(); save();
    toast(add.length ? `同步完成：新增 ${add.length} 个文件，更新 0 个` : '同步完成：没有新文件', 'good'); router();
  }, 1200);
}

/* ---------- 系统管理 ---------- */
let sysTab = 'users';
PAGES.system = () => {
  const tabs = `<div class="tabs">${[['users','用户管理'],['depts','部门管理'],['rules','考评规则'],['fill','填报规则'],['logs','操作日志']].map(([k, t]) => `<div class="tab ${sysTab === k ? 'active' : ''}" onclick="sysTab='${k}';router()">${t}</div>`).join('')}</div>`;
  const head = `<div class="page-head"><div><h3>系统管理</h3><p>账号、权限与系统参数</p></div><button class="btn danger" onclick="resetDemo()">重置演示数据</button></div>`;
  let body = '';
  if (sysTab === 'users') body = `<div class="card"><div class="toolbar"><button class="btn primary" onclick="userDlg()">${ic('plus', 16)}新增用户</button><button class="btn" onclick="toast('演示：下载导入模板 / 批量导入 Excel')">批量导入</button></div>
    <div class="table-wrap"><table class="rt cards"><thead><tr><th>姓名</th><th>账号 / 工号</th><th>部门</th><th>职务</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody>
    ${db.users.map(u => `<tr><td class="first"><b>${u.name}</b></td><td data-l="账号">${u.account} / ${u.no}</td><td data-l="部门">${deptName(u.dept)}</td><td data-l="职务">${u.title}</td>
      <td data-l="角色">${u.roles.map(r => `<span class="tag ${r === 'staff' ? '' : 'blue'}">${ROLE_NAME[r]}</span>`).join(' ')}</td><td data-l="状态">${statusTag(u.status)}</td>
      <td data-l="操作"><div class="btns"><a onclick="userDlg('${u.id}')">编辑</a><a onclick="resetPwd('${u.id}')">重置密码</a>${u.id !== ME ? `<a onclick="toggleUser('${u.id}')">${u.status === '正常' ? '停用' : '启用'}</a>` : ''}</div></td></tr>`).join('')}
    </tbody></table></div></div>`;
  if (sysTab === 'depts') body = `<div class="card">${db.depts.map(d => `<div class="lrow"><div class="ti blue todo" style="border:none;padding:0">${ic('users')}</div><div class="main"><div class="t">${d.name}</div><div class="m">${db.users.filter(u => u.dept === d.id).length} 人 · 负责人 ${db.users.filter(u => u.dept === d.id && (u.roles.includes('manager') || u.roles.includes('leader'))).map(u => u.name).join('、') || '—'}</div></div><a onclick="toast('演示：编辑部门')">编辑</a></div>`).join('')}</div>`;
  if (sysTab === 'rules') body = `<div class="card"><div class="card-title"><h4>月度考评指标与权重</h4><small>权重合计必须为 100%</small></div>
    ${db.scoreRules.map((r, i) => `<div class="rule-row"><div class="rn"><b>${r.name}</b><small>${r.desc}</small></div><input type="range" min="0" max="100" step="5" value="${r.weight}" oninput="$('#rw-${i}').value=this.value;ruleSum()"><input class="input" id="rw-${i}" type="number" value="${r.weight}" oninput="ruleSum()"></div>`).join('')}
    <div class="btns" style="justify-content:space-between;margin-top:14px"><span>权重合计：<b id="rw-sum">100</b>%</span><button class="btn primary" onclick="saveRules()">保存</button></div></div>`;
  if (sysTab === 'fill') body = `<div class="card"><div class="form-grid">${[['planRemind','周计划提醒时间'],['planDeadline','周计划截止时间'],['reportRemind','完成情况提醒时间'],['reportDeadline','完成情况截止时间'],['overdueScore','逾期处理规则'],['holiday','节假日规则']].map(([k, t]) => `<label class="field"><span>${t}</span><input id="fr-${k}" value="${esc(db.fillRules[k])}"></label>`).join('')}
    <div class="field span2"><span>提醒渠道</span><div class="btns"><label class="tag"><input type="checkbox" checked> 站内消息</label><label class="tag"><input type="checkbox"> 企业微信</label><label class="tag"><input type="checkbox"> 短信</label></div></div></div>
    <div style="text-align:right;margin-top:14px"><button class="btn primary" onclick="saveFill()">保存</button></div></div>`;
  if (sysTab === 'logs') body = `<div class="card"><div class="table-wrap"><table class="rt cards"><thead><tr><th>时间</th><th>人员</th><th>操作</th><th>对象</th></tr></thead><tbody>
    ${db.logs.slice(0, 80).map(l => `<tr><td class="first">${fmtDT(l.t)}</td><td data-l="人员">${U(l.uid).name}</td><td data-l="操作">${l.a}</td><td data-l="对象">${esc(l.o)}</td></tr>`).join('')}</tbody></table></div></div>`;
  return head + tabs + body;
};
function ruleSum(){ const s = db.scoreRules.reduce((a, r, i) => a + (+$('#rw-' + i).value || 0), 0); $('#rw-sum').textContent = s; $('#rw-sum').style.color = s === 100 ? '' : 'var(--bad)'; return s; }
function saveRules(){ if (ruleSum() !== 100) return toast('权重合计必须为 100%', 'bad'); db.scoreRules.forEach((r, i) => r.weight = +$('#rw-' + i).value); log('修改考评规则', '权重'); save(); toast('考评规则已保存', 'good'); }
function saveFill(){ Object.keys(db.fillRules).forEach(k => db.fillRules[k] = $('#fr-' + k).value); save(); toast('填报规则已保存', 'good'); }
function resetPwd(id){ U(id).pwd = '123456'; log('重置密码', U(id).name); save(); toast(`已将 ${U(id).name} 的密码重置为初始密码，首次登录需修改`, 'good'); }
function toggleUser(id){ const u = U(id); u.status = u.status === '正常' ? '停用' : '正常'; log(u.status + '账号', u.name); save(); toast(`已${u.status}：${u.name}`, 'good'); router(); }
function userDlg(id){
  const u = id ? U(id) : { name:'', account:'', no:'', dept:'d1', title:'', roles:['staff'] };
  openModal(id ? '编辑用户' : '新增用户', `<div class="form-grid">
    <label class="field"><span>姓名 <i>*</i></span><input id="us-n" value="${esc(u.name)}"></label>
    <label class="field"><span>工号 <i>*</i></span><input id="us-no" value="${esc(u.no)}"></label>
    <label class="field"><span>登录账号 <i>*</i></span><input id="us-a" value="${esc(u.account)}"></label>
    <label class="field"><span>职务</span><input id="us-t" value="${esc(u.title)}"></label>
    <label class="field span2"><span>部门</span><select id="us-d">${db.depts.map(d => `<option value="${d.id}" ${u.dept === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}</select></label>
    <div class="field span2"><span>角色（可多选）</span><div class="btns">${Object.entries(ROLE_NAME).map(([k, v]) => `<label class="tag" style="cursor:pointer"><input type="checkbox" class="us-r" value="${k}" ${u.roles.includes(k) ? 'checked' : ''} ${k === 'staff' ? 'disabled' : ''}> ${v}</label>`).join('')}</div></div>
    ${id ? '' : '<div class="notice span2" style="margin:0">初始密码为 123456，用户首次登录时需要修改。</div>'}</div>`,
    `<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveUser('${id || ''}')">保存</button>`);
}
function saveUser(id){
  const n = $('#us-n').value.trim(), a = $('#us-a').value.trim(), no = $('#us-no').value.trim();
  if (!n || !a || !no) return toast('请填写必填项', 'bad');
  if (db.users.find(x => x.account === a && x.id !== id)) return toast('登录账号已存在', 'bad');
  const data = { name:n, account:a, no, title:$('#us-t').value, dept:$('#us-d').value, roles:['staff', ...[...document.querySelectorAll('.us-r:checked')].map(i => i.value).filter(r => r !== 'staff')] };
  if (id) Object.assign(U(id), data); else db.users.push({ id:uid('u'), ...data, pwd:'123456', status:'正常' });
  log(id ? '编辑用户' : '新增用户', n); save(); closeModal(); toast('用户已保存', 'good'); router();
}

/* ---------- 我的（手机端） ---------- */
PAGES.more = () => {
  const u = me(), c = counts();
  return `<div class="card" style="display:flex;align-items:center;gap:14px"><div class="avatar" style="width:52px;height:52px;font-size:20px">${u.name.slice(-1)}</div>
    <div style="flex:1"><b style="font-size:17px">${u.name}</b><div class="muted small" style="margin-top:4px">${u.no} · ${deptName(u.dept)} · ${u.title}</div><div style="margin-top:6px">${u.roles.map(r => `<span class="tag ${r === 'staff' ? '' : 'blue'}">${ROLE_NAME[r]}</span>`).join(' ')}</div></div></div>
  <div class="card more-list" style="padding:4px 12px">
    ${MENU.flatMap(g => g.items).filter(visible).filter(i => i.k !== 'home').map(i => `<div class="nav-item" onclick="go('${i.k}')">${ic(i.i)}<span>${i.t}</span>${c[i.k] ? `<span class="badge">${c[i.k]}</span>` : '<span style="margin-left:auto" class="muted">›</span>'}</div>`).join('')}
  </div>
  <div class="card more-list" style="padding:4px 12px">
    <div class="nav-item" onclick="changePwd()">${ic('lock')}<span>修改密码</span><span style="margin-left:auto" class="muted">›</span></div>
    <div class="nav-item"><span style="display:flex;align-items:center;gap:10px">${ic('users')}演示切换账号</span><select class="input" style="margin-left:auto;width:auto;height:30px" onchange="switchUser(this.value)">${DEMO_ACCS.map(a => `<option value="${a.id}" ${a.id === ME ? 'selected' : ''}>${U(a.id).name}（${a.r}）</option>`).join('')}</select></div>
    <div class="nav-item" onclick="resetDemo()">${ic('refresh')}<span>重置演示数据</span></div>
    <div class="nav-item" onclick="logout()" style="color:var(--bad)">${ic('logout')}<span>退出登录</span></div>
  </div>`;
};

/* ---------------- 启动 ---------------- */
window.onerror = m => toast('脚本错误：' + m, 'bad');
const QS = new URLSearchParams(location.search);          // 演示用：?as=u2 直接以指定账号登录
if (QS.get('as') && db.users.find(u => u.id === QS.get('as'))){ ME = QS.get('as'); sessionStorage.setItem('hy_me', ME); }
$('#login-logo').innerHTML = DROP; $('#side-logo').innerHTML = DROP;
if (!location.hash) location.hash = '#/home';
router();
</script>
</body>
